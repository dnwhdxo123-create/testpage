<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교육 프로젝트 자동 시연</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f8;color:#1b2c46;font:14px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:7px;padding:9px 13px;background:#1767ed;color:white}header{height:48px;background:white;border-bottom:1px solid #e1e7ef;display:flex;align-items:center;justify-content:space-between;padding:0 20px}header b{font-size:16px}header small{color:#62758c}.layout{display:grid;grid-template-columns:132px 1fr;min-height:427px}aside{background:#10243f;color:#8da3c0;padding:25px 12px}aside b{display:block;color:white;margin-bottom:25px}aside span{display:block;padding:12px 8px;border-radius:6px;margin-bottom:7px}aside span:first-of-type{background:#234569;color:white}main{padding:24px}h1{font-size:23px;margin:0 0 6px}p{color:#748197;margin:0 0 20px;font-size:12px}.bar{display:flex;align-items:center;justify-content:space-between;margin:16px 0;gap:10px}.paper{background:white;border:1px solid #e1e8f1;border-radius:10px;padding:16px;box-shadow:0 5px 15px #20355005}input{width:65%;padding:10px;border:1px solid #dbe3ef;border-radius:6px;color:#536880}table{border-collapse:collapse;width:100%;font-size:12px;text-align:left}th{color:#8b98a9;font-weight:500;padding:12px 8px;border-bottom:1px solid #e8edf4}td{padding:14px 8px;border-bottom:1px solid #edf1f6}td:first-child{font-weight:600}em{font-size:10px;font-style:normal;background:#e7f5f0;color:#15865f;padding:4px 7px;border-radius:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.stats small{color:#8290a4}.stats strong{display:block;font-size:25px;margin:8px 0}.stats em{background:none;padding:0}.chart{height:150px;display:flex;gap:15px;align-items:end;padding:15px 8px 0;border-bottom:1px solid #dce5ef}.chart div{flex:1;background:linear-gradient(#5ba9ff,#2568e6);border-radius:5px 5px 0 0;transition:height .8s;position:relative;min-height:10px}.chart div:after{content:attr(data-label);position:absolute;top:100%;font-size:10px;color:#8390a2;padding-top:7px;left:5px}.chart-box{padding-bottom:40px}.dark{background:#0e1c31;color:#b9cbe2;border-color:#213854;line-height:1.9;font:12px monospace;min-height:174px}.dark div{animation:appear .4s}.dark span{color:#5be3ba}.status{display:flex;gap:8px;align-items:center;font-size:12px}.dot{height:8px;width:8px;border-radius:50%;background:#1fc994;box-shadow:0 0 0 5px #1fc99416}.progress{height:5px;background:#e8eef7;border-radius:5px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:#2476ec;transition:width .7s}.toast{position:fixed;bottom:16px;right:20px;background:#153c68;color:white;padding:11px 17px;border-radius:8px;font-size:12px;box-shadow:0 6px 20px #10243f25;transition:opacity .3s}.editor{position:absolute;inset:110px 55px 70px 180px;background:white;box-shadow:0 18px 60px #10243f40;border-radius:12px;padding:25px;z-index:2}.editor input{width:100%;margin:20px 0}.editor p{background:#f3f6fa;padding:15px;min-height:60px}.mode{background:#eaf2ff;color:#1767ed;font-size:11px;padding:6px 10px}.edited{animation:highlight 1s}@keyframes highlight{from{background:#dcecff}to{background:white}}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><header><b id="brand"></b><div><span class="mode">교육용 샘플</span> <button id="toggle">자동 시연 일시정지</button></div></header><div class="layout"><aside><b>WORKSPACE</b><span id="menu"></span><span>프로젝트 관리</span><span>활동 기록</span><span>설정</span></aside><main id="screen"></main></div><div class="toast" id="toast" role="status"></div><script>
const mode=new URLSearchParams(location.search).get('type')||'web';const $=s=>document.querySelector(s);let step=0,active=true,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;let rows=['React 프로젝트 시작하기','Spring API 연동 가이드','팀 프로젝트 회의록'];let data=[42,70,55,92,66,112];const names={web:['TEAM NOTE','팀 게시판'],data:['INSIGHT / Analytics','매출 분석'],cloud:['DEPLOY / Console','서비스 배포']};$('#brand').textContent=names[mode][0];$('#menu').textContent=names[mode][1];
function toast(s){$('#toast').textContent=s}function render(){if(mode==='web'){$('#screen').innerHTML='<h1>팀 프로젝트 게시판</h1><p>Java · Spring Boot · React로 만드는 협업 웹서비스</p><div class="bar"><input id="search" placeholder="게시글 검색"><button id="new">+ 새 글 작성</button></div><div class="paper"><table><thead><tr><th>제목</th><th>작성자</th><th>상태</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr class="edited"><td>'+r+'</td><td>김개발</td><td><em>게시됨</em></td></tr>').join('')+'</tbody></table></div><div class="bar"><small>총 '+rows.length+'개 게시글 · 샘플 프로젝트</small><small>‹　1　2　›</small></div>';$('#new').onclick=editor;$('#search').oninput=e=>document.querySelectorAll('tbody tr').forEach(r=>r.hidden=!r.textContent.includes(e.target.value));}
if(mode==='data'){$('#screen').innerHTML='<h1>커머스 데이터 대시보드</h1><p>Python · Pandas 분석 결과를 시각화한 샘플 화면</p><div class="bar"><b id="period">최근 6개월 · 전체 상품</b><button id="filter">필터 변경 ↓</button></div><div class="stats"><div class="paper"><small>총 매출</small><strong id="revenue">₩24,860,000</strong><em>↗ 전월 대비 12.8%</em></div><div class="paper"><small>주문 수</small><strong>1,284</strong><em>↗ 8.4%</em></div><div class="paper"><small>구매 전환율</small><strong>3.62%</strong><em>↗ 0.7%p</em></div></div><div class="paper chart-box"><b>월별 매출 추이</b><div class="chart">'+data.map((h,i)=>'<div style="height:'+h+'px" data-label="'+(i+1)+'월"></div>').join('')+'</div></div>';$('#filter').onclick=filter;}
if(mode==='cloud'){$('#screen').innerHTML='<div class="bar" style="margin-top:0"><div><h1>프로덕션 배포</h1><p>Docker · Linux 기반 배포 흐름 시뮬레이션</p></div><button id="deploy">새 버전 배포 ↗</button></div><div class="paper"><div class="bar" style="margin:0"><b>academy-web / production</b><span class="status"><i class="dot"></i><span id="state">정상 운영 중</span></span></div><div class="progress"><i id="progress" style="width:100%"></i></div></div><div class="bar"><b>실시간 빌드 로그</b><small>branch: main · region: seoul</small></div><div class="paper dark" id="logs"><div><span>✓</span> Service healthy · All checks passed</div></div>';$('#deploy').onclick=()=>{step=0;deploy(0)};}}
function editor(){document.querySelector('.editor')?.remove();let e=document.createElement('div');e.className='editor';e.innerHTML='<b>새 게시글 작성</b><input id="title" placeholder="제목을 입력하세요"><p>오늘 배운 내용을 팀원들과 공유합니다.<br>API와 데이터베이스 연결을 완료했습니다.</p><button id="save">게시글 등록</button>';document.body.append(e);$('#save').onclick=()=>{rows.unshift(($('#title').value||'새 프로젝트 개발 기록').replace(/[<>&]/g,''));rows=rows.slice(0,4);e.remove();render();toast('✓ 새 게시글이 등록되었습니다')};}
function filter(){let n=step%2;$('#period').textContent=n?'최근 6개월 · 디지털 상품':'최근 6개월 · 전체 상품';document.querySelectorAll('.chart div').forEach((b,i)=>b.style.height=(25+((i*31+step*19)%100))+'px');$('#revenue').textContent=n?'₩18,420,000':'₩24,860,000';toast('필터 적용 · 분석 결과를 갱신했습니다');}
const logs=['$ docker build -t academy-web:v2.4 .','✓ Dependencies installed · build completed','✓ Image pushed to container registry','✓ Security scan passed · 0 critical issues','✓ Rolling update · health check passed','✓ Deployment successful · service is live'];function deploy(n){if(n===0){$('#logs').innerHTML='';$('#state').textContent='새 버전 배포 중'}if(n<logs.length){let el=document.createElement('div');el.textContent=logs[n];$('#logs').append(el);$('#progress').style.width=((n+1)/6*100)+'%';if(n===5){$('#state').textContent='정상 운영 중';toast('✓ 새 버전 배포 완료 · 교육용 시뮬레이션')}}}
function tick(){if(paused||!active||document.hidden)return;step++;if(mode==='web'){switch(step%6){case 1:editor();toast('새 글 작성 화면을 엽니다');break;case 2:if($('#title'))$('#title').value='API 연동 테스트 완료';break;case 3:$('#save')?.click();break;case 4:rows[0]='API 연동 테스트 완료 · 수정됨';render();toast('✓ 게시글 내용을 수정했습니다');break;case 5:rows.shift();render();toast('✓ 샘플 게시글을 삭제했습니다');break;default:toast('검색 · 작성 · 수정 · 삭제 기능 자동 시연')}}if(mode==='data'){filter()}if(mode==='cloud'){deploy((step-1)%8);}}
function toggleLabel(){$('#toggle').textContent=paused?'자동 시연 재생':'자동 시연 일시정지'}$('#toggle').onclick=()=>{paused=!paused;toggleLabel()};addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='academy-demo-visibility')active=!!e.data.visible});render();toggleLabel();toast('샘플 데이터로 동작하는 프로젝트 자동 시연');setInterval(tick,1700);
</script></html>
